
# 基础生成设置
enable_rule_generator=true
overwrite_original_rules=true

# ==================== 策略组 ====================
# [策略名]`[类型]`[子策略1]`[子策略2]`[正则筛选节点]

# 🚀 代理选择：默认选择节点，包含直连和所有节点正则
custom_proxy_group=Proxy`select`[]DIRECT`.*

# 🎯 路由直连：默认直连，也可以手动切换到代理组
custom_proxy_group=Direct`select`[]DIRECT`[]Proxy

# ==================== 规则集 ====================
# 语法：ruleset=[策略名],[]内容 (或使用远程链接)

# --- 协议优化 ---
# 拦截 UDP 443 端口，防止 QUIC 协议干扰代理稳定性
ruleset=REJECT,[]AND,((PROTOCOL,UDP),(DEST-PORT,443))

# --- 重点域名 ---
# Google 相关服务走代理
ruleset=Proxy,[]GEOSITE,google

# --- 基础分流 (直连) ---
# 私有网络/局域网域名与 IP
ruleset=Direct,[]GEOSITE,private
ruleset=Direct,[]GEOIP,private,no-resolve

# 中国域名与 IP (使用 no-resolve 优化性能)
ruleset=Direct,[]GEOSITE,cn
ruleset=Direct,[]GEOIP,CN,no-resolve

# --- 全局收尾 ---
# 剩余流量默认走代理组
ruleset=Proxy,[]FINAL
