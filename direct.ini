# 基础生成设置
enable_rule_generator=true
overwrite_original_rules=true

# ==================== 策略组 ====================
# 格式：策略组名`类型`策略1`策略2`正则筛选节点
custom_proxy_group=Proxy`select`[]DIRECT`.*
custom_proxy_group=Direct`select`[]DIRECT`[]Proxy

# ==================== 规则部分 ====================
# 语法说明：
# custom_rule 会被直接插入到生成的配置文件头部。
# 格式：规则类型,参数,策略名[,no-resolve]

# 1. 协议优化：拦截 UDP 443 (QUIC)
custom_rule=AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT

# 2. 域名集合 (GEOSITE)
custom_rule=GEOSITE,google,Proxy
custom_rule=GEOSITE,private,Direct
custom_rule=GEOSITE,cn,Direct

# 3. IP 集合 (GEOIP)
custom_rule=GEOIP,private,Direct,no-resolve
custom_rule=GEOIP,CN,Direct,no-resolve

# 4. 全局匹配 (FINAL)
custom_rule=MATCH,Proxy
ruleset=Proxy,[]FINAL
