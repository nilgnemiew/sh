;acl4SSR规则-极简国内直连版 + 交易所 + AI + Grok

; ==================== 国内直连规则 ====================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; ==================== 特殊分流（必须放在 GEOIP,CN 之前） ====================
; 交易所
ruleset=💱 交易所,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Ruleset/Crypto.yaml
ruleset=💱 交易所,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Crypto.list

; AI（包含 OpenAI、Claude、Gemini 等）
ruleset=🤖 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Ruleset/OpenAi.yaml
ruleset=🤖 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; Grok 补充（xAI 服务）
- DOMAIN-SUFFIX,grok.com,🤖 AI
- DOMAIN-SUFFIX,grok.x.ai,🤖 AI
- DOMAIN-SUFFIX,x.ai,🤖 AI
- DOMAIN-SUFFIX,api.x.ai,🤖 AI
- DOMAIN-KEYWORD,grok,🤖 AI
- DOMAIN-SUFFIX,x.com,🤖 AI              ; X平台内嵌Grok（可选，可删除）

; ==================== 国内直连 + 兜底 ====================
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==================== 自定义策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]DIRECT`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

; 交易所组 - 支持手动选择单个节点
custom_proxy_group=💱 交易所`select`.*

; AI组（包含Grok） - 支持手动选择单个节点
custom_proxy_group=🤖 AI`select`.*

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`.*

enable_rule_generator=true
overwrite_original_rules=true